[I/O parameters]
# Same data directory – completion dataset stores its processed files in a separate subfolder
dataset_dir = PATH_TO_PROJECT/data
template_file = PATH_TO_PROJECT/data/template.ply
checkpoint_dir = PATH_TO_PROJECT/data/checkpoints_completion

[model parameters]
model_type = default
n_layers = 3
z_length = 256
down_sampling_factors = 2, 2, 2
# Feature lists stay 3-channel (decoder outputs xyz)
# in_channels = 4 adds a learned projection 4->3 at the encoder input
in_channels = 4
num_features_local = 3, 8, 16, 32
num_features_global = 3, 32, 64, 128
batch_norm = 1

[training parameters]
num_workers = 4
lr = 0.0003
batch_size = 32
weight_decay = 0.0001
epoch = 300
lambda_reg = 0.001
experiment_name = completion_default

[completion parameters]
# Mask ratio range: each sample gets a random ratio in [min, max]
# Keep it small-to-moderate so the model learns to fill realistic defects
mask_ratio_min = 0.05
mask_ratio_max = 0.15
# Loss weights: upweight missing region to focus learning there
lambda_missing = 3.0
lambda_known = 1.0
# Optional: path to pretrained reconstruction weights for transfer learning
# Leave empty to train from scratch
pretrained_encoder = PATH_TO_PROJECT/data/checkpoint_encoder.pt
pretrained_decoder = PATH_TO_PROJECT/data/checkpoint_decoder.pt
