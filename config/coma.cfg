# =============================================================================
#  COMA (faces) mesh completion: the one config file. DFAUST: config/dfaust.cfg
#
#    python prepare_data.py   # split + processed cache + test benchmark + leakage checks
#    python train.py          # train the diffusion model
#    python test.py           # evaluate on every test cell, print the results table
#
#  All three read this file by default; pass --config <file> to use another one.
#  Relative paths are relative to the repository root.
# =============================================================================

[I/O parameters]
# Raw COMA meshes: <data_dir>/<subject>/<expression>/<expression>.<frame>.ply
# (the layout of the COMA download). Several folders can be listed, comma-separated.
data_dir = data/COMA
# Everything this pipeline generates goes here: split lists, processed cache,
# template, benchmark, checkpoints, results. Delete it to start from scratch.
work_dir = runs/coma_subject_split

[split]
# Held-out test subjects (never seen in training).
test_subjects = FaceTalk_170913_03279_TA, FaceTalk_170915_00223_TA
# Held-out test expressions. Empty = every expression is used for training
# (pure subject split). Example: high_smile, mouth_extreme
test_expressions =
# Fraction of the training (subject, expression) pairs to keep, picked at
# random. 1.0 = every training subject contributes every expression.
train_pair_fraction = 1.0
# With train_pair_fraction < 1, each expression keeps at least this many subjects.
min_subjects_per_expression = 5
# Official COMA test frames (repo file). Removed from training; the ones of the
# training subjects form the "seen subject" reference test cell.
official_test_list = splits/coma_official_test.txt
# Only used when official_test_list is empty: hold out the last fraction of
# every sequence instead.
seen_test_fraction = 0.1
# The unseen test cells use every k-th frame of each sequence.
unseen_frame_stride = 5
# Seed for the subject/pair draws and for the benchmark masks.
seed = 2026
# Seed of the 80/20 train/validation shuffle (validation = checkpoint selection only).
val_seed = 1

[benchmark]
# Every test mesh gets one mask per strategy; hole sizes uniform in [min, max].
strategies = random_scatter, bfs_patch, plane_cut
ratio_min = 0.05
ratio_max = 0.40

[model parameters]
# Kept for the config parser. The diffusion denoiser is a vertex-resolution
# graph U-Net and does not use z_length / num_features_*.
model_type = default
n_layers = 3
z_length = 256
down_sampling_factors = 2, 2, 2
in_channels = 4
num_features_local = 3, 8, 16, 32
num_features_global = 3, 32, 64, 128
batch_norm = 1

[training parameters]
# Name of this run: checkpoints go to <work_dir>/checkpoints/predict_<predict>_<run_name>/
run_name = full
seed = 1
epoch = 300
batch_size = 4
num_workers = 2
lr = 0.0002
weight_decay = 0.0
lambda_reg = 0.0
experiment_name = coma

[completion parameters]
# Training holes are drawn on the fly with these strategies and sizes.
mask_ratio_min = 0.05
mask_ratio_max = 0.40
mask_strategies = bfs_patch, plane_cut, random_scatter
mask_strategy_weights = 0.5, 0.3, 0.2
# Loss weights: known region / missing region.
lambda_known = 1.0
lambda_missing = 3.0
# Geodesic depth-ramped weight over the hole (deeper = higher weight), rescaled
# so its mean over the hole equals depth_weight_max.
depth_weight = 1
depth_weight_max = 3.0
depth_weight_normalize = 1
depth_weight_backend = dijkstra

[diffusion parameters]
# Prediction target: x0 (clean offsets). eps / v are the ablations.
predict = x0
timesteps = 1000
schedule = cosine
# Denoiser width: base_channels * channel_mults per resolution level.
base_channels = 64
channel_mults = 1, 2, 4, 4
time_embed_dim = 128
ema_decay = 0.9995
# DDIM steps at test time (and for periodic validation sampling).
sampling_steps = 50
# Sampling clamp in standardized units.
sampling_clip = 6.0
# Surface-normal loss on the missing region (1 - cos), weighted by alpha_bar_t.
lambda_normal = 0.01
normal_snr_weight = 1
normal_use_depth_weight = 0
lambda_laplacian = 0.0
