[I/O parameters]
# Same data directory – V2 uses a separate checkpoint folder
dataset_dir = PATH_TO_PROJECT/data
template_file = PATH_TO_PROJECT/data/template.ply
checkpoint_dir = PATH_TO_PROJECT/data/checkpoints_completion_v2

[model parameters]
model_type = default
n_layers = 3
z_length = 256
down_sampling_factors = 2, 2, 2
# 4-channel input: (x, y, z, mask) with learned projection 4->3
in_channels = 4
num_features_local = 3, 8, 16, 32
num_features_global = 3, 32, 64, 128
batch_norm = 1

[training parameters]
num_workers = 4
lr = 0.0003
batch_size = 32
weight_decay = 0.0001
epoch = 300
lambda_reg = 0.001
experiment_name = completion_v2

[completion parameters]
# Base mask ratio (used when curriculum is disabled, or as fallback)
mask_ratio_min = 0.05
mask_ratio_max = 0.15

# Loss weights for region-specific L1+MSE
lambda_missing = 3.0
lambda_known = 1.0

# V2 NEW: Chamfer distance on missing vertices
# Adds a nearest-neighbor geometric loss alongside per-vertex L1+MSE
# Ramped in gradually over first 20 epochs (warm-up) to let L1+MSE stabilize first
use_chamfer = 1
lambda_chamfer = 0.5

# V2 NEW: Curriculum learning — gradually increase mask difficulty
# Starts with tiny holes (easy), ends with larger holes (hard)
curriculum = 1
curriculum_start_min = 0.02
curriculum_start_max = 0.05
curriculum_end_min = 0.10
curriculum_end_max = 0.15

# Transfer learning from V1 baseline (trained completion model)
# These point to the BASELINE completion model weights
pretrained_encoder = PATH_TO_PROJECT/data/checkpoints_completion/completion_encoder.pt
pretrained_decoder = PATH_TO_PROJECT/data/checkpoints_completion/completion_decoder.pt
