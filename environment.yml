name: 3dmesh
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0
      - torchvision
      - torch_geometric==2.6.1
      - numpy==1.26.4
      - scipy==1.15.2
      - trimesh==4.6.5
      - plyfile
      - networkx==3.4.2
      - scikit-learn==1.7.2
      - pandas==2.3.3
      - matplotlib==3.10.1
      - tqdm
      - tensorboard
      - h5py              # DFAUST export
      - pymeshlab         # optional: Mesh_completion, some baselines
      - pyvista           # optional: figures
