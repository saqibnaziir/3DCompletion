; FaceCom generator trained on OUR COMA training split.
;
; Model parameters are FaceCom's released ones, verified against their
; checkpoint_decoder.pt tensor shapes. Only the I/O paths and the training
; schedule differ.
;
; template_file is a SCRATCH path on purpose: MyDataset.process() overwrites it
; with the mean of the training meshes. It must not point at
; D:\COURSAI\3Dis\data\template.ply, which the rest of the project depends on.
;
; dataset_dir\train must hold ONLY our 16,368 training meshes (write them with
; stage_coma_trainset.py). FaceCom then makes its own internal 80/20 split of
; those, so our 20 test meshes never enter its pipeline.

[I/O parameters]
dataset_dir = D:\COURSAI\3Dis\Compattators\FaceCom\coma_dataset
template_file = D:\COURSAI\3Dis\Compattators\FaceCom\coma_dataset\template_mean.ply
checkpoint_dir = D:\COURSAI\3Dis\Compattators\FaceCom\checkpoints_coma

[model parameters]
n_layers = 3
z_length = 256
down_sampling_factors = 4, 4, 4
num_features_local = 3, 8, 16, 32
num_features_global = 3, 64, 512, 2048
batch_norm = 1

[training parameters]
num_workers = 4
lr = 0.001
batch_size = 4
weight_decay = 0.0005
epoch = 100
lambda_reg = 0.001
