; 3DGeoMeshNet config for the COMA completion baseline.
;
; The upstream D:\COURSAI\3DGeoMeshNet\config.cfg points at a stale path
; (D:\Saqib\COSURAI\FaceCom\data) and is labelled DFAUS_m_z256_5k, but the
; released checkpoints in D:\COURSAI\3DGeoMeshNet\data are COMA/FLAME:
;   encoder_local_lin.weight = (256, 160736) = 256 x (5023 * 32)
; The model parameters below are copied verbatim from the ACTIVE block of the
; upstream config and verified against every tensor shape in both checkpoints.

[I/O parameters]
dataset_dir = D:\COURSAI\3DGeoMeshNet\data
template_file = D:\COURSAI\3DGeoMeshNet\data\template.ply
checkpoint_dir = D:\COURSAI\3DGeoMeshNet\data

[model parameters]
n_layers = 3
z_length = 256
down_sampling_factors = 2, 2, 2
num_features_local = 3, 8, 16, 32
num_features_global = 3, 32, 64, 128
batch_norm = 1

[training parameters]
num_workers = 4
lr = 0.0005
batch_size = 32
weight_decay = 0.0001
epoch = 5000
lambda_reg = 0.0001
experiment_name = COMA_completion_baseline
