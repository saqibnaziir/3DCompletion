[I/O parameters]
# DFAUST (Dynamic FAUST) full-body meshes. Own dataset dir so its processed
# cache / template / checkpoints never collide with the COMA face model.
dataset_dir = PATH_TO_PROJECT/data/DFAUST_ds
template_file = PATH_TO_PROJECT/data/DFAUST_ds/template.ply
checkpoint_dir = PATH_TO_PROJECT/data/checkpoints_diffusion_dfaust

[model parameters]
# Same graph U-Net contract as the COMA diffusion model. The pooling hierarchy
# (A/D/U) is derived from the DFAUST template at build time, so nothing here is
# topology-specific; z_length / num_features_* only keep read_config() happy.
model_type = default
n_layers = 3
z_length = 256
down_sampling_factors = 2, 2, 2
in_channels = 4
num_features_local = 3, 8, 16, 32
num_features_global = 3, 32, 64, 128
batch_norm = 1

[training parameters]
# 6890-vertex bodies are heavier than COMA faces. Keep batch_size modest; raise
# it if you have spare VRAM. num_workers does the on-the-fly masking.
num_workers = 2
lr = 0.0002
batch_size = 4
weight_decay = 0.0
epoch = 400
lambda_reg = 0.0
experiment_name = diffusion_completion_dfaust

[completion parameters]
# On-the-fly masking. Bodies need larger holes than faces: a whole arm/leg is a
# big fraction of the mesh, so widen the range vs. the face model.
mask_ratio_min = 0.05
mask_ratio_max = 0.45
# Bodies: CONTIGUOUS holes only (a missing limb/region). Drop random_scatter,
# which produces swiss-cheese meshes rather than a missing part. bfs_patch grows
# a connected region from a seed vertex; plane_cut removes everything past a
# random plane (large amputations).
mask_strategies = bfs_patch, plane_cut
mask_strategy_weights = 0.7, 0.3
# Per-region weighting of the denoising loss (missing region upweighted).
lambda_known = 1.0
lambda_missing = 3.0
# Geodesic depth-ramped weighting -- see config_diffusion.cfg for the formula.
depth_weight = 0
depth_weight_max = 3.0
depth_weight_backend = dijkstra
depth_weight_normalize = 0

[diffusion parameters]
timesteps = 1000
schedule = cosine
predict = eps
base_channels = 64
channel_mults = 1, 2, 4, 4
time_embed_dim = 128
ema_decay = 0.9995
sampling_steps = 50
sampling_clip = 6.0
lambda_laplacian = 0.0
