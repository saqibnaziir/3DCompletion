[I/O parameters]
dataset_dir = PATH_TO_PROJECT/data
template_file = PATH_TO_PROJECT/data/template.ply
checkpoint_dir = PATH_TO_PROJECT/data/checkpoints_completion_v3

[model parameters]
model_type = default
n_layers = 3
z_length = 256
down_sampling_factors = 2, 2, 2
in_channels = 4
# V3: Graph-aware input block instead of simple Linear(4→3)
# 'linear' = V1 baseline (15 params), 'graph_aware' = V3 with FeaStConv (~600 params)
input_block_type = graph_aware
input_block_hidden = 16
num_features_local = 3, 8, 16, 32
num_features_global = 3, 32, 64, 128
batch_norm = 1

[training parameters]
num_workers = 4
lr = 0.0003
batch_size = 32
weight_decay = 0.0001
epoch = 300
lambda_reg = 0.001
experiment_name = completion_v3_graph_aware

[completion parameters]
mask_ratio_min = 0.05
mask_ratio_max = 0.15
lambda_missing = 3.0
lambda_known = 1.0
# Transfer learning from V1 baseline
pretrained_encoder = PATH_TO_PROJECT/data/checkpoints_completion/completion_encoder.pt
pretrained_decoder = PATH_TO_PROJECT/data/checkpoints_completion/completion_decoder.pt
