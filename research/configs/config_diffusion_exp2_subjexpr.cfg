[I/O parameters]
dataset_dir = PATH_TO_PROJECT/revision/exp2_subj_expr/data
template_file = PATH_TO_PROJECT/revision/exp2_subj_expr/data/template.ply
checkpoint_dir = PATH_TO_PROJECT/revision/exp2_subj_expr/checkpoints/diffusion
# Exp2 (subject, expression) split. Raw meshes = hard links to S_train x E_train
# only (research/revision/exp2_subj_expr/make_split.py). Nothing outside
# revision/exp2_subj_expr/ is written.
train_dir = PATH_TO_PROJECT/revision/exp2_subj_expr/raw_train

[model parameters]
# These keep config.read_config() happy. The diffusion denoiser does NOT use
# z_length / num_features_* (it is a vertex-resolution graph U-Net), but the
# parser still validates their shapes, so leave them consistent.
model_type = default
n_layers = 3
z_length = 256
down_sampling_factors = 2, 2, 2
in_channels = 4
num_features_local = 3, 8, 16, 32
num_features_global = 3, 32, 64, 128
batch_norm = 1

[training parameters]
# Laptop-friendly defaults. Raise batch_size if you have spare VRAM; raise
# num_workers if your CPU stays idle. If the machine becomes sluggish, the
# usual cause is VRAM overflow (lower batch_size) or CPU saturation (lower
# num_workers).
num_workers = 2
lr = 0.0002
batch_size = 4
weight_decay = 0.0
epoch = 600
lambda_reg = 0.0
experiment_name = diffusion_completion

[completion parameters]
# On-the-fly masking (reused from MeshCompletionDataset).
# Train on a WIDE range so the diversity/ambiguity story has large holes.
mask_ratio_min = 0.05
mask_ratio_max = 0.40
# Per-region weighting of the denoising loss (missing region upweighted).
lambda_known = 1.0
lambda_missing = 3.0
# Geodesic depth-ramped weighting (Olivier, 07-25 thread). Replaces the flat
# lambda_missing over the hole with
#   w(v) = lambda_known + (depth_weight_max - lambda_known) * d(v)/d_max
# where d(v) = geodesic distance from missing vertex v to the known boundary.
# Deepest (hardest) vertices get depth_weight_max, seam vertices stay near 1.
# Off by default; enable per-run with train_diffusion.py --depth_weight.
depth_weight = 0
depth_weight_max = 3.0
# dijkstra = exact shortest path on the mesh edge graph (no extra dependency).
# hops | euclidean | heat (heat needs potpourri3d, not installed in `3dmesh`).
depth_weight_backend = dijkstra
# Rescale the ramp so its MEAN over the hole equals depth_weight_max. The raw
# ramp averages ~w_max/2, so with 0 this arm changes both the SHAPE of the
# weighting and the overall missing-vs-known emphasis at the same time.
depth_weight_normalize = 0

[diffusion parameters]
# Number of forward diffusion timesteps (training).
timesteps = 1000
# Beta schedule: cosine (recommended) or linear.
schedule = cosine
# Prediction target: eps (predict noise) — most standard/stable.
predict = eps
# Denoiser graph U-Net width. base * mults per resolution level (len = n_layers+1).
base_channels = 64
channel_mults = 1, 2, 4, 4
time_embed_dim = 128
# EMA decay for the sampling weights.
ema_decay = 0.9995
# DDIM steps used for periodic sampling-based validation.
sampling_steps = 50
# Default sampling clamp (standardized std units) baked into the saved scale.
# 6 was the empirical sweet spot; removes spike/crater outliers. Override at
# inference with --clip if you want to sweep.
sampling_clip = 6.0
# Optional geometry-aware loss on the predicted clean shape (Laplacian smoothness
# on the missing region). 0.0 = off (recommended for the first runs).
# NOTE this is a smoothness PENALTY, not a fidelity term. The 07-31 diagnostic
# measured our roughness ratio |L(ours)|/|L(gt)| at 0.996 -- already correct --
# so turning this on would push the surface BELOW GT roughness and make it worse
# while its own number improved. Prefer lambda_normal below. Leave at 0.0.
lambda_laplacian = 0.0

# Surface-normal loss (Olivier, 07-30): 1 - cos between predicted and GT vertex
# normals over the missing region, added to the positional MSE. 0.0 = off.
# Justified by the 07-31 diagnostics: position and normal error are almost
# uncorrelated per vertex (Spearman 0.08), so this is new signal rather than a
# restatement of the MSE; and ~73% of the orientation error is systematic, i.e.
# reachable by a loss (the other ~27% is sampling diversity, left alone by design).
lambda_normal = 0.0
# Weight the normal term by alpha_bar_t (1 -> 0 as noise grows). At high noise
# the predicted x0 is meaningless and differencing amplifies that noise, so the
# term is concentrated where x0_pred is informative. Costs no hyperparameter.
normal_snr_weight = 1
# Apply the geodesic depth ramp to the normal term too (default: uniform over
# the hole, so the depth ramp stays a property of the POSITIONAL loss only).
normal_use_depth_weight = 0
